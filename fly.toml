app = "wcag-score-worker"
primary_region = "sin"

[build]

[env]
  SURREAL_NAMESPACE = "wcag-score"
  SURREAL_DATABASE = "main"
  BROWSERLESS_URL = "wss://chrome.browserless.io"
  WORKER_POLL_INTERVAL_MS = "5000"
  WORKER_BATCH_SIZE = "5"
  WORKER_SCAN_CONCURRENCY = "5"

[machine]
  size = "shared-cpu-4x"
