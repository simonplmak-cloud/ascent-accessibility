app = "wcag-score-worker"
primary_region = "sin"

[build]

[env]
  SURREAL_NAMESPACE = "wcag-score"
  SURREAL_DATABASE = "main"
  WORKER_POLL_INTERVAL_MS = "5000"
  WORKER_BATCH_SIZE = "5"
  WORKER_SCAN_CONCURRENCY = "3"
  WORKER_ASSESSMENT_CONCURRENCY = "2"

[machine]
  size = "shared-cpu-2x"
  memory = "4096"
