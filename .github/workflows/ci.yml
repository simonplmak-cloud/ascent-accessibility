name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests (with coverage gate)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Dependency audit (critical only)
        run: pnpm audit --audit-level=critical

      - name: Secret scan (common patterns)
        run: |
          if git grep -nE "(AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk_live_[0-9a-zA-Z]{16,})" -- . ':!pnpm-lock.yaml'; then
            echo "::error::secret-like pattern detected in tracked files" && exit 1
          fi
          echo "no secret-like patterns found"
